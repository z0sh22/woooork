name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v

  docker-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: docker build --tag safety-games-sandbox:local sandbox
      - run: python -m unittest tests.test_sandbox_integration tests.test_episode_integration -v
        env:
          SAFETY_GAMES_DOCKER_TESTS: '1'
      - run: python -m safety_games validate-tasks
